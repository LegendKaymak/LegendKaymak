<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="90" viewBox="0 0 1200 90" role="img" aria-label="Made by LegendKaymak">
  <style>
    @keyframes w{to{transform:translateX(-600px)}}
    .w{animation:w 12s linear infinite}
  </style>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF7A3D" stop-opacity="0"/><stop offset=".25" stop-color="#FF7A3D"/><stop offset=".5" stop-color="#FF3D8B"/><stop offset=".75" stop-color="#7C5CFF"/><stop offset="1" stop-color="#7C5CFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="c"><rect width="1200" height="90"/></clipPath>
    <linearGradient id="mg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#000"/><stop offset=".2" stop-color="#fff"/><stop offset=".8" stop-color="#fff"/><stop offset="1" stop-color="#000"/></linearGradient>
    <mask id="m" maskUnits="userSpaceOnUse" x="0" y="0" width="1200" height="90"><rect width="1200" height="90" fill="url(#mg)"/></mask>
    <linearGradient id="g2" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="300" y2="0" spreadMethod="reflect"><stop offset="0" stop-color="#FF7A3D"/><stop offset=".5" stop-color="#FF3D8B"/><stop offset="1" stop-color="#7C5CFF"/></linearGradient>
  </defs>
  <g clip-path="url(#c)" mask="url(#m)">
    <g class="w">
      <path d="M0 30 Q150 6 300 30 T600 30 T900 30 T1200 30 T1500 30 T1800 30" fill="none" stroke="url(#g2)" stroke-width="2"/>
    </g>
  </g>
  <text x="600" y="72" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="13" letter-spacing="4" fill="#8B879A">MADE BY LEGENDKAYMAK</text>
</svg>
